name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calidad-y-humo:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-solo-pruebas
          POSTGRES_DB: rae
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s
          --health-timeout=5s --health-retries=12
    env:
      DATABASE_URL: postgresql://postgres:ci-solo-pruebas@localhost:5432/rae
      DIRECT_URL: postgresql://postgres:ci-solo-pruebas@localhost:5432/rae
      JWT_ACCESS_SECRET: ci-secreto-de-prueba-de-al-menos-32-bytes-xx
      CRON_SECRET: ci-secreto-cron-de-prueba
      COOKIE_SECURE: 'false'
      ADMIN_DOCUMENTO: '70000001'
      ADMIN_CLAVE_INICIAL: CLAVEPRUEBA2026
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma generate
      - run: pnpm --filter @rae/shared build
      - run: pnpm --filter api build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter web build
      - name: Migrar y sembrar
        run: |
          pnpm --filter api exec prisma migrate deploy
          cd apps/api && node dist/sembrar.js
      - name: Prueba de punta a punta
        run: |
          (cd apps/web && NODE_ENV=production pnpm exec next start -p 3000 > /tmp/web.log 2>&1 &)
          for i in $(seq 1 40); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 1; done
          mkdir -p /tmp/humo && cp scripts/prueba-humo.mjs /tmp/humo/
          cd /tmp/humo && npm init -y >/dev/null && npm i exceljs@4 jszip@3 --silent
          node prueba-humo.mjs
      - name: Registros si algo falla
        if: failure()
        run: tail -60 /tmp/web.log
