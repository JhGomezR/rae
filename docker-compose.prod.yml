# Despliegue en un VPS: solo requiere este archivo, deploy/Caddyfile y .env.prod.
#   docker compose -f docker-compose.prod.yml --env-file .env.prod pull
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
name: seguimiento-rae

x-api-env: &api-env
  NODE_ENV: production
  TZ: America/Bogota
  API_PORT: 4000
  DATABASE_URL: mysql://rae:${MYSQL_PASSWORD:?Define MYSQL_PASSWORD}@db:3306/seguimiento_rae
  WEB_ORIGIN: ${APP_URL:?Define APP_URL}
  APP_URL: ${APP_URL}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Define JWT_ACCESS_SECRET}
  JWT_ACCESS_MINUTOS: 15
  REFRESH_TTL_DAYS: 7
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  ADMIN_DOCUMENTO: ${ADMIN_DOCUMENTO:?Define ADMIN_DOCUMENTO}
  ADMIN_CLAVE_INICIAL: ${ADMIN_CLAVE_INICIAL:?Define ADMIN_CLAVE_INICIAL}
  ADMIN_NOMBRE: ${ADMIN_NOMBRE:-Administrador}
  MAIL_TRANSPORT: ${MAIL_TRANSPORT:-log}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-Seguimiento RAE <no-responder@localhost>}

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    environment:
      MYSQL_DATABASE: seguimiento_rae
      MYSQL_USER: rae
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD}
      TZ: America/Bogota
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -urae -p"$$MYSQL_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [interna]

  migrate:
    image: ${API_IMAGE:-ghcr.io/jhgomezr/rae-api:latest}
    restart: 'no'
    command: ['sh', '-c', 'npx prisma migrate deploy && node dist/sembrar.js']
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
    networks: [interna]

  api:
    image: ${API_IMAGE:-ghcr.io/jhgomezr/rae-api:latest}
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [interna]

  web:
    image: ${WEB_IMAGE:-ghcr.io/jhgomezr/rae-web:latest}
    restart: unless-stopped
    environment:
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    depends_on:
      api:
        condition: service_healthy
    networks: [interna]

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO:-:80}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [interna]

  backup:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_PWD: ${MYSQL_PASSWORD}
      TZ: America/Bogota
    entrypoint: ['sh', '-c']
    command:
      - |
        while true; do
          f=/backups/rae-$$(date +%F).sql.gz
          mysqldump -h db -u rae --single-transaction --no-tablespaces seguimiento_rae | gzip > "$$f.tmp" && mv "$$f.tmp" "$$f"
          find /backups -name 'rae-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done
    volumes:
      - db-backups:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [interna]

volumes:
  db-data:
  db-backups:
  caddy-data:
  caddy-config:

networks:
  interna:
